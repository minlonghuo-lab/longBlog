<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>回复终端访客 · longBlog</title>
  <style>
    :root { color-scheme: light dark; --surface: #fafaf8; --ink: #242528; --muted: #6d7076; --line: #dedfd9; --blue: #1466b6; --green: #43773d; --warn: #a04d32; }
    @media (prefers-color-scheme: dark) { :root { --surface: #202225; --ink: #e2e3df; --muted: #a4a6aa; --line: #3d4146; --blue: #8bbafa; --green: #a6cd98; --warn: #f3a583; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: var(--surface); color: var(--ink); font: 16px/1.75 ui-monospace, 'SFMono-Regular', Consolas, monospace; }
    main { max-width: 620px; margin: auto; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 0 18px; border-bottom: 1px solid var(--line); }
    h1 { font-size: 17px; font-weight: 500; margin: 0; }
    .eyebrow { font-size: 12px; color: var(--blue); margin: 0 0 4px; }
    #session { color: var(--muted); font-size: 12px; }
    #messages { min-height: 180px; max-height: 45svh; overflow: auto; margin: 20px 0; padding-right: 8px; }
    .message { margin-bottom: 18px; }
    .name { color: var(--blue); font-size: 12px; }
    .author .name { color: var(--green); }
    .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 4px 0 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    label { display: block; margin-bottom: 8px; font-size: 14px; }
    textarea { display: block; width: 100%; min-height: 120px; resize: vertical; padding: 14px; font: 16px/1.75 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; }
    textarea:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    .actions { display: flex; align-items: center; justify-content: space-between; margin: 14px 0; }
    button { border: 1px solid var(--blue); border-radius: 8px; background: var(--blue); color: var(--surface); padding: 10px 22px; font: inherit; cursor: pointer; min-height: 44px; }
    button:hover { filter: brightness(.93); }
    button:disabled { opacity: .5; cursor: wait; }
    #count, .hint, #status { color: var(--muted); font-size: 12px; }
    #status[data-error='true'] { color: var(--warn); }
    #status { min-height: 24px; }
    .hint { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 22px; }
    @media (prefers-reduced-motion: no-preference) { button { transition: filter 150ms ease; } }
  </style>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">longBlog / terminal</p><h1>回复终端访客</h1></div><span id="session"></span></header>
    <div id="messages" aria-label="最近对话" aria-live="polite"></div>
    <form id="reply-form">
      <label for="reply">给访客的回复</label>
      <textarea id="reply" maxlength="500" placeholder="输入回复内容…" required></textarea>
      <div class="actions"><span id="count">0 / 500</span><button id="send" type="submit" disabled>发送回复</button></div>
    </form>
    <p id="status" role="status">正在读取对话…</p>
    <p class="hint">回复保存后，访客在原标签页进入 chat 即可查看。链接仅用于当前会话，请勿转发。</p>
  </main>
  <script src="./reply.js" defer></script>
</body>
</html>
